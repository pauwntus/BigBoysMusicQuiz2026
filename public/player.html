<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎵 Big Boys Music Quiz</title>
  <link rel="stylesheet" href="/css/player.css">
</head>
<body>

  <!-- CHARACTER CREATOR -->
  <div id="screen-select" class="screen active">
    <div class="creator-wrap">
      <div class="select-title">🎵 Big Boys Music Quiz 2026</div>

      <!-- Live preview -->
      <div class="char-preview">
        <div class="preview-avatar" id="preview-avatar">🎵</div>
        <div class="preview-name" id="preview-name">Ditt namn</div>
      </div>

      <!-- Name input -->
      <div class="creator-section">
        <label class="creator-label">NAMN</label>
        <input type="text" id="name-input" class="name-input"
          placeholder="Skriv ditt namn…" maxlength="20"
          autocomplete="off" spellcheck="false">
      </div>

      <!-- Emoji picker -->
      <div class="creator-section">
        <label class="creator-label">IKON</label>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>

      <!-- Color picker -->
      <div class="creator-section">
        <label class="creator-label">FÄRG</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>

      <div id="select-error" class="select-error hidden"></div>
      <button id="btn-join" class="btn-join" disabled>⚡ ANSLUT!</button>
    </div>
  </div>

  <!-- LOBBY (waiting) -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-player-card" id="player-card">
      <div class="player-avatar" id="player-avatar">🎵</div>
      <div class="player-name" id="player-name-display">Namn</div>
      <div class="player-score-label">Poäng</div>
      <div class="player-score" id="player-score">0</div>
    </div>
    <div class="status-msg" id="lobby-status">
      <div class="pulse-dot"></div>
      <span>Väntar på att quizet startar…</span>
    </div>
  </div>

  <!-- BUZZ SCREEN -->
  <div id="screen-buzz" class="screen">
    <div class="buzz-content">
      <div class="buzz-question" id="buzz-question-text">Fråga laddas…</div>
      <button id="buzz-btn" class="buzz-button">
        <span class="buzz-btn-label">BUZZ!</span>
      </button>
      <div class="buzz-status" id="buzz-status"></div>
      <div class="timer-bar-wrap">
        <div class="timer-bar" id="timer-bar"></div>
      </div>
    </div>
  </div>

  <!-- MULTIPLE CHOICE SCREEN -->
  <div id="screen-mc" class="screen">
    <div class="mc-content">
      <div class="mc-category" id="mc-category">Kategori</div>
      <div class="mc-question" id="mc-question">Frågetexten…</div>
      <div class="mc-options" id="mc-options"></div>
      <div class="timer-bar-wrap">
        <div class="timer-bar" id="mc-timer-bar"></div>
      </div>
      <div class="mc-status" id="mc-status"></div>
    </div>
  </div>

  <!-- MUSIK-SVAR SCREEN -->
  <div id="screen-music-answer" class="screen">
    <div class="music-answer-content">
      <div class="mc-category" id="music-ans-category">🎵 Gissa Låten</div>
      <div class="music-listen-anim">
        <span class="sound-pulse"></span>
        <span class="sound-pulse"></span>
        <span class="sound-pulse"></span>
      </div>
      <p class="music-ans-hint">Lyssna och skriv in svaret!</p>
      <div class="music-inputs">
        <div class="music-input-group">
          <label class="music-input-label">🎵 LÅTENS TITEL</label>
          <input type="text" id="music-title-input" class="music-text-input"
            placeholder="Skriv titeln…" autocomplete="off" spellcheck="false">
        </div>
        <div class="music-input-group">
          <label class="music-input-label">🎤 ARTIST</label>
          <input type="text" id="music-artist-input" class="music-text-input"
            placeholder="Skriv artisten…" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <button id="music-submit-btn" class="btn-music-submit">SKICKA SVAR ✓</button>
      <div class="timer-bar-wrap">
        <div class="timer-bar" id="music-timer-bar"></div>
      </div>
      <div class="mc-status" id="music-status"></div>
    </div>
  </div>

  <!-- REVEAL SCREEN -->
  <div id="screen-reveal" class="screen">
    <div class="reveal-content">
      <div class="reveal-result-icon" id="reveal-icon">–</div>
      <div class="reveal-result-text" id="reveal-text">–</div>
      <div class="reveal-correct-answer">
        <span class="reveal-answer-label">Rätt svar:</span>
        <span class="reveal-answer-val" id="reveal-answer-val">–</span>
      </div>
      <div class="reveal-score-gained" id="reveal-pts"></div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="screen-gameover" class="screen">
    <div class="gameover-content">
      <div class="gameover-icon">🏆</div>
      <div class="gameover-title">Spelet Slut!</div>
      <div class="final-score-display" id="final-score-display">0p</div>
      <div class="final-rank" id="final-rank"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
